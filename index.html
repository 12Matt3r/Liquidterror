<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ᖴᒪOOᗪEᗩᗪ</title>
    <link rel="icon" type="image/png" href="./LOGO.png">
    <style>
        /* Enhanced index page styling with modern design */
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        /* ========================================|
           Full page background styling for the div
        ========================================| */
        .background-container {
            position: absolute;
            top: 50%; /* Centers vertically */
            left: 50%; /* Centers horizontally */
            width: 90%; /* Take full width */
            height: 90%; /* Take full height */
            transform: translate(-50%, -50%); /* Adjusts the element to exactly center */
            z-index: -1; /* Ensure it stays behind the content */
        }

        .background-container video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the video covers the whole div */
        }

        /* Enhanced particle background effect */
        .background-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(112, 111, 211, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(102, 126, 234, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(118, 75, 162, 0.1) 0%, transparent 50%);
            animation: particleFloat 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes particleFloat {
            0%, 100% { opacity: 0.3; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.6; transform: scale(1.1) rotate(180deg); }
        }

        /* ========================================|
           Body styling
        ========================================| */
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            filter: contrast(1.060);
            overflow: hidden;
        }

        h1 {
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        p {
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        /* Enhanced animations for better game feel */
        @keyframes flicker {
            0%, 100% { opacity: 1; filter: brightness(1) drop-shadow(0 0 20px rgba(112, 111, 211, 0.6)); }
            25% { opacity: 0.8; filter: brightness(0.9) drop-shadow(0 0 15px rgba(112, 111, 211, 0.4)); }
            50% { opacity: 1; filter: brightness(1.1) drop-shadow(0 0 25px rgba(112, 111, 211, 0.8)); }
            75% { opacity: 0.9; filter: brightness(0.95) drop-shadow(0 0 18px rgba(112, 111, 211, 0.5)); }
        }

        .game-image {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 120%;
            max-height: 110vh;
            margin-bottom: 20px;
            animation: flicker 3s infinite ease-in-out;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.7));
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .game-image:hover {
            transform: translate(-50%, -50%) scale(1.02);
            filter: drop-shadow(0 20px 40px rgba(112, 111, 211, 0.4));
        }

        /* ========================================|
           Start Game Button styling
        ========================================| */
        .start-game-button {
            position: fixed;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            font-size: 18px;
            border: none;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            color: white;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .start-game-button:hover {
            background: rgba(102, 126, 234, 0.3);
            transform: translate(-50%, -50%) translateY(-5px);
            box-shadow: 0 15px 45px rgba(102, 126, 234, 0.4);
            border-color: #667eea;
        }

        .start-game-button:active {
            transform: translate(-50%, -50%) translateY(-2px);
        }

        /* ========================================|
           Transition and Skip button styling
        ========================================| */
        #transition-image, #skip-button {
            transition: opacity 2s ease-in-out; /* Smooth fade-in effect */
        }

        /* Initially hidden */
        #transition-image {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            z-index: 2;
            opacity: 0; /* Start as invisible */
        }

        /* Skip button styling */
        #skip-button {
            display: none;
            font-family: 'Courier New', Courier, monospace;
            position: fixed;
            top: 10%;
            right: 10%;
            transform: translateX(-50%);
            font-size: 15px;
            padding: 10px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 3;
            opacity: 0; /* Start as invisible */
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        #skip-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-50%) scale(1.05);
        }

        /* Enhanced loading states */
        .content-container {
            position: relative;
            z-index: 1;
            animation: contentFadeIn 2s ease-out;
        }

        @keyframes contentFadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- ========================================|
         Background div with an MP4 video
    ========================================| -->
    <div class="background-container">
        <video autoplay muted loop>
            <source src="./vid/home.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <!-- ========================================|
         Background audio
    ========================================| -->
    <audio id="background-audio" autoplay loop>
        <source src="./sounds/Free Horror Ambience (Dark Project).mp3" type="audio/mp3">
        Your browser does not support the audio tag.
    </audio>

    <!-- ========================================|
         Main content
    ========================================| -->
    <div class="content-container">
        <img class="game-image" src="./PRESENTATION.png" alt="Game Presentation">
     
        <button class="start-game-button">Start Game</button>
        <!-- Image for transition (initially hidden) -->
        <img id="transition-image" src="./PRESENTATION2.png" alt="Transition Image">
        <!-- Skip Button -->
        <button id="skip-button">Skip>></button>
    </div>

    <!-- ========================================|
         JavaScript functionality
    ========================================| -->
    <script>
        // Handle button click
        document.querySelector('.start-game-button').addEventListener('click', function () {
            // Show the transition image and skip button
            const transitionImage = document.getElementById('transition-image');
            const skipButton = document.getElementById('skip-button');
            
            transitionImage.style.display = 'block';  // Make the transition image visible
            skipButton.style.display = 'block';       // Make the skip button visible
            
            // Start the fade-in effect for both
            setTimeout(() => {
                transitionImage.style.opacity = 1;  // Fade in transition image
                skipButton.style.opacity = 1;       // Fade in skip button
            }, 10);  // Small delay to trigger transition

            // Wait for 25 seconds before redirecting
            setTimeout(function () {
                transitionImage.style.display = 'none';  // Hide the image
                skipButton.style.display = 'none';       // Hide the button
                location.href = './launch.html';         // Redirect to launch.html
            }, 25000);  // 25000 milliseconds = 25 seconds

            // Skip button functionality
            skipButton.addEventListener('click', function () {
                transitionImage.style.display = 'none';  // Hide the image
                skipButton.style.display = 'none';       // Hide the button
                location.href = './launch.html';         // Redirect to launch.html
            });
        });
    </script>
</body>
</html>
